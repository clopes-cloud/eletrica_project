<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Página não encontrada | Eletro Tech</title>

    <meta name="robots" content="noindex, follow">

    <link rel="icon" type="image/webp" href="/images/favicon.webp">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101820;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 550px;
        }

        .error-code {
            font-size: 110px;
            font-weight: bold;
            color: #f5a623;
            line-height: 1;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #c5cbd1;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 14px 28px;
            background: #f5a623;
            color: #101820;
            text-decoration: none;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
        }

        .button:hover {
            background: #ffffff;
        }

        .brand {
            margin-top: 45px;
            font-size: 14px;
            color: #89939c;
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 85px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="error-code">404</div>

        <h1>Ops! Página não encontrada.</h1>

        <p>
            O endereço que você tentou acessar não existe
            ou foi removido. Mas podemos ajudar você a
            encontrar o que procura.
        </p>

        <a href="/" class="button">
            Voltar para o início
        </a>

        <div class="brand">
            Eletro Tech Energia | Engenharia Elétrica
        </div>

    </main>

</body>
</html>
